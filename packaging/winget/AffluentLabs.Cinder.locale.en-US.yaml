ShortDescription: Open-source digital-forensics toolkit
Description: |-
  Cinder consolidates eight separate forensic tools (Autopsy, FTK Imager,
  Eric Zimmerman's suite, Volatility, Hindsight, ExifTool, Plaso, WinHex)
  into one modern cross-platform application built on .NET 10 and
  Avalonia 11. Reads E01 / VHD / VHDX / raw images in-process, parses
  every common Windows + Linux artifact, ships court-ready PDF + DOCX
  reports, and includes a bring-your-own-model AI copilot.
