<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cinder logo — the ember mark.

  Concept: a flame curling over a glowing ember. Forensics is what remains after
  the fire. The asymmetric flame (lean right, with a wisp falling left) gives the
  glyph a direction so it doesn't read as a generic teardrop. The inner ember is a
  soft circle in white-hot orange that survives whatever-sized rendering — it's
  what tells you "Cinder" even at 16×16.

  Palette is the Cinder accent ramp from Themes/Cinder.Tokens.axaml:
    #FFB347  →  #FF7A1A  →  #B4540F  (lightest highlight → core → deep)
    Ember:     #FFE6CC                (almost white)

  Geometry is hand-tuned so the silhouette stays readable when:
    • drawn at 16×16 (Explorer file list)
    • drawn in the title bar at 20×20
    • drawn as a 256×256 high-DPI taskbar icon
    • inverted on a light background (the dark stroke gives it shape)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256"
     role="img" aria-label="Cinder">

  <defs>
    <!-- Ember body: dark deep at the base, hot orange in the middle, yellow tip. -->
    <linearGradient id="cinder-flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"  stop-color="#8A3A00" />
      <stop offset="35%" stop-color="#B4540F" />
      <stop offset="70%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>

    <!-- The glowing core inside the flame. -->
    <radialGradient id="cinder-core" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%"  stop-color="#FFFBEA" />
      <stop offset="55%" stop-color="#FFE6CC" />
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Flame body. Path is hand-tuned: tall pointed tip, swelling middle, narrowed waist,
       rounded base, with a small notch on the right hip for asymmetry. -->
  <path d="M32 3
           C 28 13, 22 19, 19 26
           C 16 33, 16 39, 19 46
           C 22 53, 27 58, 32 60
           C 38 59, 44 54, 47 47
           C 50 40, 49 33, 45 27
           C 42 23, 39 21, 38 18
           C 37 22, 34 24, 32 22
           C 31 18, 33 12, 32 3 Z"
        fill="url(#cinder-flame)" />

  <!-- Inner glowing core. Slightly offset toward the bottom — that's where the
       hot coal would be. -->
  <ellipse cx="32" cy="44" rx="8" ry="9" fill="url(#cinder-core)" />

  <!-- A small high-contrast highlight on the upper-left of the core — sells the
       sense of a real ember catching light. Removed at the smallest sizes where it
       would just blur into the core. -->
  <circle cx="29" cy="40" r="2.4" fill="#FFFFFF" opacity="0.7" />

</svg>
