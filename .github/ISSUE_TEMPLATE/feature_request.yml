name: Feature request
description: Suggest a new feature or enhancement
title: "[feat]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the feature
      placeholder: When I'm investigating X, I find that...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would Cinder address this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you've thought about

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to similar features in other tools, papers, blog posts, etc.

  - type: dropdown
    id: phase
    attributes:
      label: Which roadmap phase does this fit?
      description: See ROADMAP.md
      options:
        - Phase 1 - Hex viewer & hashing
        - Phase 2 - Imaging & verification
        - Phase 3 - Filesystem + carving
        - Phase 4 - Windows artifacts
        - Phase 5 - Linux artifacts
        - Phase 6 - Search, indexing, timeline
        - Phase 7 - Memory forensics
        - Phase 8 - Reporting & case management
        - Phase 9 - AI copilot
        - Phase 10 - Network, mobile, cloud
        - Not sure / cross-cutting
