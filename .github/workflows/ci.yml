name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev libfuse3-dev

      - name: Restore .NET
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test .NET
        timeout-minutes: 15
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      # parsers/requirements.txt is the *runtime* venv list PythonBootstrap installs on a
      # user's machine on demand — libewf, pytsk3, libesedb, libpff, pyaff4, yara-python, all
      # native builds and several without wheels for current Python. The Python tests here
      # exercise the JSON-RPC protocol layer and need only pydantic + pytest, so that is what
      # CI installs. Installing the runtime list in CI was failing on packages the tests never
      # import, which had been masking the (passing) .NET test result behind a red job.
      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "parsers/[dev]"
        shell: bash

      - name: Test Python parsers
        run: |
          if [ -d parsers ]; then cd parsers && pytest -v; fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the
      # output has to be inspected. SECURITY.md claims a clean audit; this makes that
      # claim enforced rather than asserted.
      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          # Key on the advisory URL: it appears once per vulnerable package and nowhere else,
          # unlike the '>' prefix, which also marks every transitive package in other listings.
          if grep -q 'github.com/advisories' audit.txt; then
            echo "::error::Vulnerable NuGet packages detected — see the audit output above."
            exit 1
          fi
          echo "No vulnerable packages."

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet format
        run: dotnet format --verify-no-changes --severity warn

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install black ruff mypy
      - name: Black
        run: black --check parsers/ || true
      - name: Ruff
        run: ruff check parsers/ || true
      - name: Mypy
        run: mypy parsers/ --ignore-missing-imports || true
