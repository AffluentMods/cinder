name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev libfuse3-dev

      - name: Restore .NET
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Install Python parser deps
        run: |
          python -m pip install --upgrade pip
          if [ -f parsers/pyproject.toml ]; then pip install -e parsers/[dev]; fi
          if [ -f parsers/requirements.txt ]; then pip install -r parsers/requirements.txt; fi
        shell: bash

      - name: Test Python parsers
        run: |
          if [ -d parsers ]; then cd parsers && pytest -v; fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: dotnet format
        run: dotnet format --verify-no-changes --severity warn

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install black ruff mypy
      - name: Black
        run: black --check parsers/ || true
      - name: Ruff
        run: ruff check parsers/ || true
      - name: Mypy
        run: mypy parsers/ --ignore-missing-imports || true
