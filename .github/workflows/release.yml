name: Release

# Triggered by a semver tag (v1.2.3) or manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (without leading v, e.g. 0.1.0)."
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:

  # =========================================================================
  # VERIFY — nothing is published unless the suite passes on both platforms.
  # The release path previously built and shipped without ever running tests.
  # =========================================================================
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        timeout-minutes: 15
        run: dotnet test --no-build --configuration Release

      - name: Fail on vulnerable packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q 'github.com/advisories' audit.txt; then
            echo "::error::Vulnerable NuGet packages detected — refusing to publish."
            exit 1
          fi


  # =========================================================================
  # WINDOWS — produces a self-contained single-file .exe.
  # SignPath signing engages automatically once the repo variable
  # SIGNPATH_ENABLED is set to "true" and SIGNPATH_API_TOKEN is in secrets.
  # Until then, the unsigned artifact is uploaded and shipped as-is.
  # =========================================================================
  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-path: ${{ steps.publish.outputs.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Publish self-contained
        id: publish
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish src/Cinder.App `
            --configuration Release `
            --runtime win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -o publish/win-x64
          "path=publish/win-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinder-windows-unsigned
          path: publish/win-x64/
          if-no-files-found: error

      # ------------------------------------------------------------------
      # SignPath integration — runs only when the repo variable
      # SIGNPATH_ENABLED is exactly "true" (set under Settings → Variables).
      # Until then the workflow happily produces an unsigned build.
      # ------------------------------------------------------------------
      - name: Submit to SignPath
        id: signpath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: cinder
          signing-policy-slug: release-signing
          artifact-configuration-slug: cinder-windows
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/win-x64-signed

      - name: Upload signed artifact
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinder-windows-signed
          path: publish/win-x64-signed/
          if-no-files-found: error

  # =========================================================================
  # LINUX — produces a self-contained binary. AppImage / .deb / .rpm
  # packaging will be wired in once the recipes under installer/linux/ land.
  # =========================================================================
  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained
        run: |
          dotnet publish src/Cinder.App \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/linux-x64

      - name: Tar the Linux build
        run: |
          cd publish
          tar czf cinder-linux-x64.tar.gz -C linux-x64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinder-linux
          path: publish/cinder-linux-x64.tar.gz
          if-no-files-found: error

  # =========================================================================
  # RELEASE — collects all artifacts and publishes a GitHub Release.
  # Auto-generated notes come from PR titles since the previous tag.
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # Software bill of materials: every NuGet package, direct and transitive, that ends up in
      # the shipped app, in CycloneDX JSON. Consumers can diff it against advisories without
      # trusting the release notes.
      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/Cinder.App/Cinder.App.csproj -o sbom -j -f cinder-sbom.cdx.json

      - name: Stage release files
        # Explicit allow-list — never trust the publish output to be clean.
        # If a future NuGet package decides to ship fonts/licences/icons via
        # <None CopyToOutputDirectory>, they'd otherwise show up as stray
        # release assets next to the real binaries. So name what we ship,
        # and ignore everything else.
        run: |
          mkdir -p release-files

          # Windows: prefer the signed .exe, fall back to unsigned. The signed
          # build comes back from SignPath under cinder-windows-signed/ when
          # SIGNPATH_ENABLED is true; otherwise we ship cinder-windows-unsigned/.
          if [[ -f artifacts/cinder-windows-signed/Cinder.exe ]]; then
            cp artifacts/cinder-windows-signed/Cinder.exe release-files/Cinder.exe
            echo "Windows: shipping SIGNED Cinder.exe"
          elif [[ -f artifacts/cinder-windows-unsigned/Cinder.exe ]]; then
            cp artifacts/cinder-windows-unsigned/Cinder.exe release-files/Cinder.exe
            echo "Windows: shipping UNSIGNED Cinder.exe (SignPath not yet wired)"
          else
            echo "::error::No Cinder.exe found in artifacts/"
            ls -la artifacts/ || true
            exit 1
          fi

          # Linux tarball — already a single file from the build job.
          if [[ -f artifacts/cinder-linux/cinder-linux-x64.tar.gz ]]; then
            cp artifacts/cinder-linux/cinder-linux-x64.tar.gz release-files/
          else
            echo "::error::No cinder-linux-x64.tar.gz found in artifacts/"
            ls -la artifacts/cinder-linux/ || true
            exit 1
          fi

          cp sbom/cinder-sbom.cdx.json release-files/

          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo "---- Release files ----"
          ls -la
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-files/*
          body: |
            ## Cinder ${{ github.ref_name }}

            Open-source forensics toolkit by Affluent Labs.

            ### Downloads

            - **Windows** — `Cinder.exe` (self-contained, single-file build).
              **Currently unsigned.** Windows will show a SmartScreen prompt on
              first launch — click *More info* → *Run anyway*. An application to
              the [SignPath Foundation](https://signpath.org)'s free signing
              programme for open-source projects is pending; the release workflow
              submits signing requests automatically once it is approved. Verify
              the download against `SHA256SUMS.txt` below in the meantime.
            - **Linux** — `cinder-linux-x64.tar.gz` (self-contained, single-file
              binary; extract and run).

            ### Verification

            `SHA256SUMS.txt` contains hashes for every artifact in this release.
            `cinder-sbom.cdx.json` is the CycloneDX software bill of materials for
            the shipped application — every package, direct and transitive.

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ### Permissions

            Forensic tools need raw disk access.

            - Windows: launch with administrator privileges.
            - Linux: `sudo cinder`, or grant once with
              `sudo setcap cap_sys_rawio,cap_sys_admin+ep $(which cinder)`.

            ### Status

            See [ROADMAP.md](https://github.com/AffluentMods/cinder/blob/main/ROADMAP.md)
            for what's shipping when.
